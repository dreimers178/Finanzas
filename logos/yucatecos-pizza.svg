<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <clipPath id="escena"><circle cx="300" cy="300" r="200"/></clipPath>
    <path id="arcoSup" d="M 80,300 A 220,220 0 0 1 520,300"/>
    <path id="arcoInf" d="M 38,300 A 262,262 0 0 0 562,300"/>
    <radialGradient id="cielo" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#FFE7A8"/>
      <stop offset="1" stop-color="#FFC56B"/>
    </radialGradient>
  </defs>

  <!-- Anillo exterior -->
  <circle cx="300" cy="300" r="292" fill="#C8102E"/>
  <circle cx="300" cy="300" r="278" fill="none" stroke="#FFF4DC" stroke-width="3"/>
  <circle cx="300" cy="300" r="206" fill="none" stroke="#FFF4DC" stroke-width="3"/>

  <!-- Escena central -->
  <g clip-path="url(#escena)">
    <rect x="100" y="100" width="400" height="400" fill="url(#cielo)"/>

    <!-- Pizza como sol -->
    <g transform="translate(300,240)">
      <circle r="125" fill="#E8A33D"/>
      <circle r="125" fill="none" stroke="#B9741F" stroke-width="4"/>
      <circle r="108" fill="#D7372A"/>
      <path d="M-70,-40 q20,-30 50,-15 q25,-25 55,0 q35,5 30,40 q30,25 0,50 q-10,35 -50,25 q-30,25 -55,0 q-40,0 -35,-40 q-25,-35 5,-60z" fill="#FFD45C"/>
      <g stroke="#B9741F" stroke-width="3">
        <line x1="0" y1="-108" x2="0" y2="108"/>
        <line x1="-108" y1="0" x2="108" y2="0"/>
        <line x1="-76" y1="-76" x2="76" y2="76"/>
        <line x1="76" y1="-76" x2="-76" y2="76"/>
      </g>
      <g fill="#9E1B1B">
        <circle cx="-45" cy="-62" r="13"/>
        <circle cx="38" cy="-70" r="12"/>
        <circle cx="70" cy="-20" r="13"/>
        <circle cx="-75" cy="-15" r="12"/>
        <circle cx="-20" cy="-30" r="11"/>
        <circle cx="30" cy="-28" r="10"/>
      </g>
      <g fill="#3C8D3F">
        <ellipse cx="-5" cy="-85" rx="8" ry="4" transform="rotate(-30 -5 -85)"/>
        <ellipse cx="55" cy="-48" rx="8" ry="4" transform="rotate(25 55 -48)"/>
        <ellipse cx="-60" cy="-38" rx="8" ry="4" transform="rotate(40 -60 -38)"/>
      </g>
    </g>

    <!-- Selva / suelo -->
    <rect x="100" y="425" width="400" height="80" fill="#2E6B34"/>
    <path d="M100,430 q20,-25 40,0 q20,-30 40,0 q20,-20 40,0 L380,430 q20,-25 40,0 q20,-30 40,0 q20,-20 40,0 V440 H100z" fill="#3C8D3F"/>

    <!-- Pirámide maya escalonada -->
    <g fill="#6B4426">
      <rect x="130" y="400" width="340" height="32"/>
      <rect x="160" y="370" width="280" height="31"/>
      <rect x="190" y="340" width="220" height="31"/>
      <rect x="220" y="310" width="160" height="31"/>
      <rect x="248" y="282" width="104" height="29"/>
    </g>
    <g fill="#8A5A34">
      <rect x="130" y="400" width="340" height="6"/>
      <rect x="160" y="370" width="280" height="6"/>
      <rect x="190" y="340" width="220" height="6"/>
      <rect x="220" y="310" width="160" height="6"/>
      <rect x="248" y="282" width="104" height="6"/>
    </g>

    <!-- Escalinata central -->
    <rect x="280" y="282" width="40" height="150" fill="#A8743F"/>
    <g stroke="#6B4426" stroke-width="2">
      <line x1="280" y1="292" x2="320" y2="292"/><line x1="280" y1="302" x2="320" y2="302"/>
      <line x1="280" y1="312" x2="320" y2="312"/><line x1="280" y1="322" x2="320" y2="322"/>
      <line x1="280" y1="332" x2="320" y2="332"/><line x1="280" y1="342" x2="320" y2="342"/>
      <line x1="280" y1="352" x2="320" y2="352"/><line x1="280" y1="362" x2="320" y2="362"/>
      <line x1="280" y1="372" x2="320" y2="372"/><line x1="280" y1="382" x2="320" y2="382"/>
      <line x1="280" y1="392" x2="320" y2="392"/><line x1="280" y1="402" x2="320" y2="402"/>
      <line x1="280" y1="412" x2="320" y2="412"/><line x1="280" y1="422" x2="320" y2="422"/>
    </g>
    <rect x="274" y="282" width="6" height="150" fill="#4E301A"/>
    <rect x="320" y="282" width="6" height="150" fill="#4E301A"/>

    <!-- Templo superior -->
    <rect x="262" y="242" width="76" height="41" fill="#6B4426"/>
    <rect x="254" y="232" width="92" height="12" fill="#4E301A"/>
    <rect x="290" y="256" width="20" height="27" fill="#2B1A0E"/>
    <rect x="270" y="252" width="12" height="8" fill="#8A5A34"/>
    <rect x="318" y="252" width="12" height="8" fill="#8A5A34"/>
  </g>

  <!-- Texto -->
  <g font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" fill="#FFF4DC" text-anchor="middle">
    <text font-size="50" letter-spacing="4"><textPath href="#arcoSup" startOffset="50%">YUCATECOS</textPath></text>
    <text font-size="50" letter-spacing="10"><textPath href="#arcoInf" startOffset="50%">PIZZA</textPath></text>
  </g>

  <!-- Separadores -->
  <g fill="#FFD45C">
    <polygon points="44,300 56,288 68,300 56,312"/>
    <polygon points="532,300 544,288 556,300 544,312"/>
  </g>
</svg>
